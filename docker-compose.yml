services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cadcode:latest
    restart: unless-stopped
    # Bind to localhost only; the Cloudflare tunnel fronts it (cad.enzomaruffa.dev).
    ports:
      - "127.0.0.1:21310:8000"
    environment:
      # Agent model + keys (set OPENAI_API_KEY in .env on the host).
      CAD_AGENT_MODEL: ${CAD_AGENT_MODEL:-openai:gpt-5.6-terra}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # Persist git checkpoints + user projects across restarts/redeploys.
      - cad-workspace:/data/workspace
      - cad-projects:/data/projects

volumes:
  cad-workspace:
  cad-projects:
