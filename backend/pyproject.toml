[project]
name = "cadcode-backend"
version = "0.1.0"
description = "AI-native code-first CAD — FastAPI backend, build123d kernel, PydanticAI agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "build123d>=0.9",
    "ocp-tessellate>=3.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
agent = [
    "pydantic-ai-slim[anthropic]>=0.0.30",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
