[project]
name = "cadcode-backend"
version = "0.1.0"
description = "AI-native code-first CAD — FastAPI backend, build123d kernel, PydanticAI agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "build123d>=0.9",
    "ocp-tessellate>=3.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
agent = [
    "pydantic-ai-slim[anthropic,google]>=2.1.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "lib"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter handles code width; long lines that remain are prose in prompt
# strings (the agent instructions), which shouldn't be hard-wrapped.
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# Sandbox-loaded modules (build123d/ocp_tessellate/lib) are imported lazily and
# resolved at runtime; don't fail the check on their dynamic surface.
respect-ignore-files = true
